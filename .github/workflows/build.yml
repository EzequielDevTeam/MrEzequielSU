name: Build MrEzequielSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codigo completo
        uses: actions/checkout@v7

      - name: Aplicar icones do mascote
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert assets/icons/nerd.jpg -resize 512x512! app/src/main/res/mipmap-xxxhdpi/mascot_fg.png
          convert assets/icons/nerd.jpg -resize 512x512! app/src/main/ic_launcher-playstore.png
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="mascot_bg">#FF1A120B</color>' \
            '</resources>' > app/src/main/res/values/mascot_colors.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/mascot_bg"/>' \
            '    <foreground android:drawable="@mipmap/mascot_fg"/>' \
            '    <monochrome android:drawable="@mipmap/mascot_fg"/>' \
            '</adaptive-icon>' > app/src/main/res/mipmap-anydpi/ic_launcher.xml
          ls -lh app/src/main/res/mipmap-xxxhdpi/mascot_fg.png

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup update stable
          cargo install cargo-ndk
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          chmod +x gradlew && ./gradlew clean assembleDebug assembleRelease

      - name: Assinar release com chave fixa
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;35.0.0" > /dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for APK in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" sign --key keys/mre-release.pk8 --cert keys/mre-release.x509.pem --out "${APK%.apk}-signed.apk" "$APK"
            mv "${APK%.apk}-signed.apk" "$APK"
          done
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -n 8

      - name: Verificar UI no APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          for s in bg_mode MascotTheme; do
            c=$(unzip -p "$APK" 'classes*.dex' | grep -a -c "$s" || true)
            echo "$s: $c"
            [ "$c" -gt 0 ] || (echo "FALHA: $s ausente no dex" && exit 1)
          done

      - name: Upload mapping (desofuscar crashes)
        uses: actions/upload-artifact@v7
        with:
          name: MrEzequielSU-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MrEzequielSU APKs
        uses: actions/upload-artifact@v7
        with:
          name: MrEzequielSU
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
